<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#B58CFF"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151020"/>
      <stop offset="100%" stop-color="#0B0912"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Escuro com Bordas Arredondadas -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#30243F" stroke-width="1.5"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="url(#purpleGrad)" stroke-width="1" opacity="0.5"/>

  <!-- Monograma TT Estilizado -->
  <g filter="url(#purpleGlow)">
    <!-- Primeiro T -->
    <path d="M14 20 H30 M22 20 V46" stroke="url(#purpleGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Segundo T -->
    <path d="M34 20 H50 M42 20 V46" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Ponto de Status Cibernético Luminescente -->
  <circle cx="51" cy="15" r="3.5" fill="#10B981"/>
</svg>
